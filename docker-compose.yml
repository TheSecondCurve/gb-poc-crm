services:
  app:
    build: .
    image: xhs-matrix:latest
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file: .env
    environment:
      DB_PATH: /data/app.db
      HOST: 0.0.0.0
      PORT: "3000"
    volumes:
      - xhs-data:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  xhs-data:
